name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the version commit and the tag, and creates the GitHub release.
      contents: write
      # PyPI trusted publishing authenticates with the OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Bump the version
        id: bump
        run: |
          uv version --bump ${{ inputs.bump }}
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push --atomic origin HEAD "v${{ steps.bump.outputs.version }}"
      - run: uv build
      - run: uv publish
      - name: Create the GitHub release
        run: gh release create "v${{ steps.bump.outputs.version }}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
